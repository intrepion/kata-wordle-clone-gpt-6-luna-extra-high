<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f1" />
    <meta name="description" content="A daily five-letter word puzzle. Six guesses, one new word every day." />
    <title>Wordle — Daily word puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Wordle home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-name">wordle</span>
          <span class="brand-edition">DAILY</span>
        </div>
        <nav class="top-actions" aria-label="Game options">
          <button class="icon-button" id="help-button" aria-label="How to play" title="How to play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1 .9-1.9 1.2-1.9 2.8M12 17h.01"></path></svg>
          </button>
          <button class="icon-button" id="stats-button" aria-label="Statistics" title="Statistics">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17M8 16v-4M12 16V8M16 16v-7M20 16V4"></path></svg>
          </button>
          <button class="icon-button" id="settings-button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"></path><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"></path></svg>
          </button>
        </nav>
      </header>

      <main>
        <section class="game-panel" aria-label="Daily word puzzle">
          <div class="puzzle-meta">
            <span class="eyebrow" id="puzzle-date">DAILY PUZZLE</span>
            <span class="meta-divider" aria-hidden="true"></span>
            <span class="meta-copy">6 tries <span aria-hidden="true">·</span> 5 letters</span>
          </div>

          <div class="board" id="board" role="grid" aria-label="Six guesses, five letters each"></div>
          <p class="status-message" id="status-message" aria-live="polite" aria-atomic="true"></p>
          <div class="keyboard" id="keyboard" aria-label="On-screen keyboard"></div>

          <div class="game-footer">
            <span><span class="live-dot"></span> New word at midnight</span>
            <button class="text-button" id="share-button" hidden>Share result <span aria-hidden="true">↗</span></button>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <button class="modal-close icon-button" id="modal-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
        </button>
        <div id="modal-content"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="word-bank.js"></script>
    <script src="game.js"></script>
  </body>
</html>
